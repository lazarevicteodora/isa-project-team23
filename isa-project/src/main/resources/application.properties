spring.application.name=isa-project

# CRDT Replica ID
crdt.replica.id=${REPLICA_ID:replica-1}
# Replica ID (override se iz Docker environment varijabli)
replica.id=${REPLICA_ID:local}

crdt.replica.urls=${REPLICA_URLS:} 
# Push sync nakon izmene (true/false)
crdt.sync.push-enabled=${CRDT_PUSH_ENABLED:true}

#Periodi?na background sync (true/false)
crdt.sync.periodic-enabled=${CRDT_PERIODIC_ENABLED:true}


# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (override se iz Docker environment varijabli)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/isa_project_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# HikariCP Connection Pool Settings (KRITI?NO za klaster!)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Jackson Configuration (Spring Boot 4 compatible)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Belgrade

# CORS Configuration (dodato nginx i Docker portovi)
cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:80,http://localhost:8081,http://localhost:8082
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# JWT
jwt.secret=somesecret-key-for-jwt-token-has-to-be-512-bits-long-1234567890123456789012345678901234567890
jwt.header=Authorization
jwt.clock-skew=300
jwt.expires-in=86400000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=teodora.lazarevic251103@gmail.com
spring.mail.password=bihk ufpv iocn ript
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.rs.ac.uns.ftn.isa=DEBUG

# SQL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Cache Configuration
spring.cache.jcache.config=classpath:ehcache.xml

# Rate Limiter za komentare (60 komentara/sat)
resilience4j.ratelimiter.instances.commentLimiter.limitForPeriod=60
resilience4j.ratelimiter.instances.commentLimiter.limitRefreshPeriod=1h
resilience4j.ratelimiter.instances.commentLimiter.timeoutDuration=0

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2MB

# Server Timeout Configuration
server.tomcat.connection-timeout=600000
server.tomcat.max-http-form-post-size=500MB
spring.mvc.async.request-timeout=600000

# ==================== RABBITMQ CONFIGURATION ====================
# RabbitMQ connection settings
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Transcoding Queue Configuration
rabbitmq.transcoding.queue=video.transcoding.queue
rabbitmq.transcoding.dlq=video.transcoding.dlq
rabbitmq.transcoding.exchange=video.transcoding.exchange
rabbitmq.transcoding.routingkey=video.transcoding
rabbitmq.transcoding.dlq.routingkey=video.transcoding.dlq

# Consumer configuration
consumer.id=consumer-1

# ==================== TRANSCODING CONFIGURATION ====================
# Predefinisane rezolucije za transcoding (comma-separated)
transcoding.resolutions=720p,480p,360p

# Output direktorijum za transcode-ovane video fajlove
transcoding.output.directory=storage/transcoded

# Thumbnail kompresija - cron izraz za svaki dan u ponoc (00:00:00)
thumbnail.compression.cron=0 0 0 * * *

# Kvalitet kompresije (0.0 - 1.0), 0.5 = 50% originalnog kvaliteta
thumbnail.compression.quality=0.5

# Prefiks za kompresovane slike
thumbnail.compression.prefix=compressed_