version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: jutjubic-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - jutjubic-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Replica 1
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jutjubic-backend1
    environment:
      REPLICA_ID: replica-1
      SERVER_PORT: 8080
      REPLICA_URLS: http://backend2:8080
      CRDT_PUSH_ENABLED: "true"
      CRDT_PERIODIC_ENABLED: "true"

      #  Spoj se na HOST bazu (localhost iz perspektive tvog računara)
      DB_URL: jdbc:postgresql://host.docker.internal:5432/isa_project_db
      DB_USERNAME: postgres
      DB_PASSWORD: root

      # RabbitMQ connection
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # Consumer ID (svaki backend može biti consumer)
      CONSUMER_ID: consumer-backend1

      SPRING_PROFILES_ACTIVE: production

      JAVA_OPTS: >
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
    ports:
      - "8081:8080"
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache
    networks:
      - jutjubic-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Backend Replica 2
  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jutjubic-backend2
    environment:
      REPLICA_ID: replica-2
      SERVER_PORT: 8080
      REPLICA_URLS: http://backend1:8080
      CRDT_PUSH_ENABLED: "true"
      CRDT_PERIODIC_ENABLED: "true"

      # ✅ Ista baza kao replica 1!
      DB_URL: jdbc:postgresql://host.docker.internal:5432/isa_project_db
      DB_USERNAME: postgres
      DB_PASSWORD: root

      # RabbitMQ connection
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # Consumer ID
      CONSUMER_ID: consumer-backend2

      SPRING_PROFILES_ACTIVE: production

      JAVA_OPTS: >
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
    ports:
      - "8082:8080"
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache
    networks:
      - jutjubic-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped


  # Dedicirani Transcoding Consumer 1
  transcoding-consumer-1:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: jutjubic-transcoding-consumer-1
      environment:
        # Isti DB i RabbitMQ kao backend
        DB_URL: jdbc:postgresql://host.docker.internal:5432/isa_project_db
        DB_USERNAME: postgres
        DB_PASSWORD: root

        SPRING_RABBITMQ_HOST: rabbitmq
        SPRING_RABBITMQ_PORT: 5672
        SPRING_RABBITMQ_USERNAME: guest
        SPRING_RABBITMQ_PASSWORD: guest

        # Consumer ID
        CONSUMER_ID: transcoding-consumer-1

        SPRING_PROFILES_ACTIVE: consumer


        # Oznaka da je ovo dedicated consumer (ne pokreće web server)
        SPRING_MAIN_WEB_APPLICATION_TYPE: servlet

        JAVA_OPTS: >
          -Xms256m
          -Xmx512m
          -XX:+UseG1GC
      volumes:
        - ./storage:/app/storage
      networks:
        - jutjubic-network
      depends_on:
        rabbitmq:
          condition: service_healthy
      restart: unless-stopped

  # Dedicirani Transcoding Consumer 2
  transcoding-consumer-2:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: jutjubic-transcoding-consumer-2
      environment:
        DB_URL: jdbc:postgresql://host.docker.internal:5432/isa_project_db
        DB_USERNAME: postgres
        DB_PASSWORD: root

        SPRING_RABBITMQ_HOST: rabbitmq
        SPRING_RABBITMQ_PORT: 5672
        SPRING_RABBITMQ_USERNAME: guest
        SPRING_RABBITMQ_PASSWORD: guest

        CONSUMER_ID: transcoding-consumer-2

        SPRING_PROFILES_ACTIVE: consumer


        SPRING_MAIN_WEB_APPLICATION_TYPE: servlet

        JAVA_OPTS: >
          -Xms256m
          -Xmx512m
          -XX:+UseG1GC
      volumes:
        - ./storage:/app/storage
      networks:
        - jutjubic-network
      depends_on:
        rabbitmq:
          condition: service_healthy
      restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: jutjubic-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - jutjubic-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: jutjubic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - jutjubic-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: jutjubic-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    depends_on:
      - prometheus
    networks:
      - jutjubic-network
    restart: unless-stopped

networks:
  jutjubic-network:
    driver: bridge

volumes:
  rabbitmq_data:

